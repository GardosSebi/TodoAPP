# Rollback: deploy a specific commit (e.g. previous SHA after a bad release)
name: Rollback

on:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Git commit SHA to deploy (e.g. from git log or Actions run)'
        required: true
        type: string

env:
  APP_DIR: /opt/app

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code at rollback SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.rollback_sha }}

      - name: Get git SHA
        id: git
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        env:
          SSH_KEY: ~/.ssh/deploy_key
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i $SSH_KEY -r ./app $EC2_USER@$EC2_HOST:$APP_DIR/
          scp -i $SSH_KEY -r ./deploy $EC2_USER@$EC2_HOST:$APP_DIR/

      - name: Deploy application (rollback)
        env:
          SSH_KEY: ~/.ssh/deploy_key
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GIT_SHA: ${{ steps.git.outputs.sha }}
        run: |
          ssh -i $SSH_KEY $EC2_USER@$EC2_HOST bash -c "
            set -e
            export GIT_SHA=$GIT_SHA
            cd /opt/app/deploy
            docker compose down || true
            docker compose build --no-cache
            GIT_SHA=$GIT_SHA docker compose up -d
            echo 'Waiting for containers...'
            sleep 10
          "

      - name: Health check
        env:
          SSH_KEY: ~/.ssh/deploy_key
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          sleep 5
          ssh -i $SSH_KEY $EC2_USER@$EC2_HOST bash -c "
            max_attempts=30
            attempt=0
            while [ \$attempt -lt \$max_attempts ]; do
              if curl -f http://localhost/health > /dev/null 2>&1; then
                echo 'Rollback health check passed!'
                curl http://localhost/health
                curl http://localhost/version
                exit 0
              fi
              attempt=\$((attempt + 1))
              echo \"Attempt \$attempt/\$max_attempts...\"
              sleep 2
            done
            echo 'Health check failed'
            docker compose -f /opt/app/deploy/docker-compose.yml logs
            exit 1
          "
